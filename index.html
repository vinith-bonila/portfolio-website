<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vinith Bonila — Python developer and Petroleum Engineering graduate shipping production-grade AI systems end to end."
    />
    <meta name="author" content="Vinith Bonila" />

    <!-- Open Graph -->
    <meta property="og:title" content="Vinith Bonila — Data & AI/ML Engineer" />
    <meta
      property="og:description"
      content="Ships production-grade AI systems end to end. Two live LLM applications backed by FastAPI, Docker, tests, and CI."
    />
    <meta property="og:type" content="website" />
    <!--
      After deploying, set og:url and og:image to your ABSOLUTE domain
      (e.g. https://vinithbonila.com/og-image.png). LinkedIn/Twitter require
      absolute URLs; the relative paths below work on Slack/Discord/Telegram.
    -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vinith Bonila — portfolio preview card" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vinith Bonila — Data & AI/ML Engineer" />
    <meta
      name="twitter:description"
      content="Ships production-grade AI systems end to end. Two live LLM applications backed by FastAPI, Docker, tests, and CI."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts: preconnect + Space Grotesk (headings) + JetBrains Mono (labels/metrics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Vinith Bonila — Data & AI/ML Engineer</title>

    <!--
      Structured data (Schema.org Person) — helps Google and recruiter tools
      understand who this page is about. After deploying, set "url" and the
      image path to your absolute domain.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Vinith Bonila",
        "url": "https://your-domain.com",
        "image": "https://your-domain.com/og-image.png",
        "jobTitle": "Data & AI/ML Engineer",
        "email": "mailto:bonilavinith@gmail.com",
        "telephone": "+91-7396878717",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Visakhapatnam",
          "addressCountry": "IN"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Indian Institute of Petroleum and Energy (IIPE), Visakhapatnam"
        },
        "knowsAbout": [
          "Python",
          "SQL",
          "Retrieval-Augmented Generation",
          "Large Language Models",
          "Natural Language Processing",
          "FastAPI",
          "Docker",
          "Machine Learning",
          "Power BI",
          "Data Analytics"
        ],
        "sameAs": [
          "https://github.com/vinith-bonila",
          "https://linkedin.com/in/vinith-bonila-1510bv"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
